name: Deploy — Dev EC2

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup QEMU (REQUIRED for ARM builds)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3️⃣ Setup Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4️⃣ Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5️⃣ Build & Push MULTI-ARCH image (🔥 FIXED)
      - name: Build and push image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/everything-florence-backend:dev
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6️⃣ Copy docker-compose to EC2
      - name: Copy docker-compose.dev.yml to EC2
        run: |
          mkdir -p /tmp/ssh
          printf '%s\n' "${{ secrets.DEV_EC2_SSH_KEY }}" > /tmp/ssh/id_rsa
          chmod 600 /tmp/ssh/id_rsa

          ssh -o StrictHostKeyChecking=no -i /tmp/ssh/id_rsa ubuntu@${{ secrets.DEV_EC2_HOST }} \
            "mkdir -p /home/ubuntu/florence-backend"

          scp -o StrictHostKeyChecking=no -i /tmp/ssh/id_rsa \
            docker-compose.dev.yml \
            ubuntu@${{ secrets.DEV_EC2_HOST }}:/home/ubuntu/florence-backend/docker-compose.dev.yml

      # 7️⃣ Deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/florence-backend

            # ── Create .env ───────────────────────────────────────────────
            cat > .env <<'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}

            # 🔥 ADD THESE (fix docker-compose warning)
            DB_NAME=florence_dev
            DB_USER=florence
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            JWT_SECRET_ACCESS_KEY=${{ secrets.JWT_SECRET_ACCESS_KEY }}
            JWT_SECRET_REFRESH_KEY=${{ secrets.JWT_SECRET_REFRESH_KEY }}
            ACCESS_TOKEN_TTL=${{ secrets.ACCESS_TOKEN_TTL }}
            REFRESH_TOKEN_TTL=${{ secrets.REFRESH_TOKEN_TTL }}
            NODE_ENV=${{ secrets.NODE_ENV }}

            S3_ASSET_BUCKET_NAME=${{ secrets.S3_ASSET_BUCKET_NAME }}
            AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}

            SMTP_FROM=${{ secrets.SMTP_FROM }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}

            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}

            PAYSTACK_API_BASE_URL=${{ secrets.PAYSTACK_API_BASE_URL }}
            PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}
            PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}

            STORE_NAME=${{ secrets.STORE_NAME }}
            SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            MAX_CACHE_ITEMS=${{ secrets.MAX_CACHE_ITEMS }}
            EOF

            chmod 600 .env
            echo "✓ .env created"

            # ── Docker login ─────────────────────────────────────────────
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # ── Pull latest image ────────────────────────────────────────
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
              docker compose -f docker-compose.dev.yml pull app

            echo "✓ Image pulled"

            # ── Restart ONLY app ─────────────────────────────────────────
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
              docker compose -f docker-compose.dev.yml up -d --no-deps app

            echo "✓ App restarted"

            # ── Cleanup ─────────────────────────────────────────────────
            docker image prune -f

            echo "🚀 Deploy complete"
            docker compose -f docker-compose.dev.yml ps