name: Deploy — Dev EC2

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_BUILDKIT: 1

    steps:
      # ─────────────────────────────
      # 1️⃣ Checkout
      # ─────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────
      # 2️⃣ QEMU (ARM builds)
      # ─────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ─────────────────────────────
      # 3️⃣ Buildx (WITH CACHE DRIVER)
      # ─────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─────────────────────────────
      # 4️⃣ DockerHub login
      # ─────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ─────────────────────────────
      # 5️⃣ Build & Push (WITH LAYER CACHE 🔥)
      # ─────────────────────────────
      - name: Build and push image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.dev
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/everything-florence-backend:dev
          platforms: linux/arm64

          # ── 🔥 FAST LAYER CACHE (KEY PART)
          cache-from: type=gha
          cache-to: type=gha,mode=max

          # extra speed boost
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # ─────────────────────────────
      # 6️⃣ Copy compose to EC2
      # ─────────────────────────────
      - name: Copy docker-compose.dev.yml to EC2
        run: |
          mkdir -p /tmp/ssh
          printf '%s\n' "${{ secrets.DEV_EC2_SSH_KEY }}" > /tmp/ssh/id_rsa
          chmod 600 /tmp/ssh/id_rsa

          ssh -o StrictHostKeyChecking=no -i /tmp/ssh/id_rsa \
            ubuntu@${{ secrets.DEV_EC2_HOST }} \
            "mkdir -p /home/ubuntu/florence-backend"

          scp -o StrictHostKeyChecking=no -i /tmp/ssh/id_rsa \
            docker-compose.dev.yml \
            ubuntu@${{ secrets.DEV_EC2_HOST }}:/home/ubuntu/florence-backend/docker-compose.dev.yml

      # ─────────────────────────────
      # 7️⃣ Deploy
      # ─────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/florence-backend

            # ── .env ─────────────────────────────
            cat > .env <<EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DB_NAME=florence_dev
            DB_USER=florence
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            JWT_SECRET_ACCESS_KEY=${{ secrets.JWT_SECRET_ACCESS_KEY }}
            JWT_SECRET_REFRESH_KEY=${{ secrets.JWT_SECRET_REFRESH_KEY }}

            NODE_ENV=${{ secrets.NODE_ENV }}

            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            EOF

            chmod 600 .env

            # ── login
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # ── pull latest image
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
              docker compose -f docker-compose.dev.yml pull

            # ── restart stack
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
              docker compose -f docker-compose.dev.yml up -d

            echo "🚀 Deploy complete"
            docker compose -f docker-compose.dev.yml ps