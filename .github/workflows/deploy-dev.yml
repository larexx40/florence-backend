name: Deploy — Dev EC2

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (dev tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/everything-florence-backend:dev
          # Layer cache speeds up subsequent builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to dev EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/florence-backend

            # ── Write .env from GitHub Secrets ────────────────────────────────────────
            cat > .env <<'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET_ACCESS_KEY=${{ secrets.JWT_SECRET_ACCESS_KEY }}
            JWT_SECRET_REFRESH_KEY=${{ secrets.JWT_SECRET_REFRESH_KEY }}
            ACCESS_TOKEN_TTL=${{ secrets.ACCESS_TOKEN_TTL }}
            REFRESH_TOKEN_TTL=${{ secrets.REFRESH_TOKEN_TTL }}
            NODE_ENV=${{ secrets.NODE_ENV }}
            S3_ASSET_BUCKET_NAME=${{ secrets.S3_ASSET_BUCKET_NAME }}
            AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            PAYSTACK_API_BASE_URL=${{ secrets.PAYSTACK_API_BASE_URL }}
            PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}
            PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}
            STORE_NAME=${{ secrets.STORE_NAME }}
            SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            MAX_CACHE_ITEMS=${{ secrets.MAX_CACHE_ITEMS }}
            EOF

            # Secure .env with strict permissions
            chmod 600 .env
            echo "✓ .env created with secure permissions (600)"

            # ── Docker login and pull ──────────────────────────────────────────────────
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull the new image and restart only the app container.
            # postgres and redis keep running — no downtime on those.
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
              docker compose -f docker-compose.dev.yml pull app
            echo "✓ Docker image pulled"

            # ── Start app with new .env ────────────────────────────────────────────────
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} \
              docker compose -f docker-compose.dev.yml up -d --no-deps app
            echo "✓ App started"

            # ── Cleanup old images ─────────────────────────────────────────────────────
            docker image prune -f

            echo "Deploy complete. Running containers:"
            docker compose -f docker-compose.dev.yml ps
