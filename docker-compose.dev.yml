services:
  postgres:
    image: postgres:16-alpine
    container_name: florence-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-florence_dev}
      POSTGRES_USER: ${DB_USER:-florence}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-florence} -d ${DB_NAME:-florence_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - florence-net

  redis:
    image: redis:7-alpine
    container_name: florence-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - florence-net

  app:
    image: ${DOCKERHUB_USERNAME}/everything-florence-backend:dev
    container_name: florence-app-dev
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: staging

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    # 🔥 HEALTHCHECK (critical for visibility)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - florence-net

volumes:
  postgres-data:
  redis-data:

networks:
  florence-net:
    driver: bridge