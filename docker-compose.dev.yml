version: "3.9"

# Dev-only compose: app + postgres + redis all on one EC2.
# Production will use RDS for postgres and a separate EC2 for redis.

services:
  postgres:
    image: postgres:16-alpine
    container_name: florence-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-florence_dev}
      POSTGRES_USER: ${DB_USER:-florence}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-florence} -d ${DB_NAME:-florence_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - florence-net

  redis:
    image: redis:7-alpine
    container_name: florence-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - florence-net

  app:
    image: ${DOCKERHUB_USERNAME}/florence-backend:dev
    container_name: florence-app-dev
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - florence-net

volumes:
  postgres-data:
  redis-data:

networks:
  florence-net:
    driver: bridge
