services:
  loki:
    image: grafana/loki:3.0.0
    container_name: florence-loki
    restart: unless-stopped
    volumes:
      - ./docker/loki:/etc/loki
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - florence-net

  promtail:
    image: grafana/promtail:3.0.0
    container_name: florence-promtail
    restart: unless-stopped
    volumes:
      - ./docker/promtail:/etc/promtail
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - florence-net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: florence-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Remove the default "explore" nav item noise
      - GF_EXPLORE_ENABLED=true
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - florence-net

volumes:
  loki-data:
  grafana-data:

networks:
  florence-net:
    # Must match the network name declared in docker-compose.dev.yml
    external: true
