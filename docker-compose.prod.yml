version: "3.9"

# Production compose: app only.
# Postgres → AWS RDS (DATABASE_URL in .env)
# Redis    → separate EC2 (REDIS_HOST in .env)

services:
  app:
    image: ${DOCKERHUB_USERNAME}/florence-backend:latest
    container_name: florence-app-prod
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - florence-net

networks:
  florence-net:
    driver: bridge
