# /etc/nginx/sites-available/florence-dev
# After Certbot runs, it will add the SSL block automatically below this.

server {
    listen 80;
    server_name dev.api.everythingflorences.com;

    # Certbot will insert the redirect + SSL block here.
    # Leave the location block so it works over HTTP first during bootstrap.
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout    300;
        proxy_connect_timeout 300;
        proxy_send_timeout    300;

        # Swagger UI loads fine with these headers
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }

    # Health check endpoint — no auth, used by load balancers / uptime monitors
    location /health {
        proxy_pass http://localhost:3000/health;
        access_log off;
    }
}
